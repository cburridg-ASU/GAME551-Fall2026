<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | DumRocGame</title>
    <style>
      html, body { width: 100%; height: 100%; }
    </style>
  </head>
  <body style="margin: 0; width: 100%; height: 100%; overflow: hidden; display: grid; place-items: center; background: #D2BC9C">
    <canvas id="unity-canvas" width="360" height="640" style="display: block; width: 100%; height: 100%; background: #D2BC9C"></canvas>
    <script src="Build/Webgl.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/Webgl.data.unityweb",
        frameworkUrl: "Build/Webgl.framework.js.unityweb",
        codeUrl: "Build/Webgl.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "MythosGames",
        productName: "DumRocGame",
        productVersion: "1.0.3",
        matchWebGLToCanvasSize: true,
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      });
    </script>
  </body>
</html>

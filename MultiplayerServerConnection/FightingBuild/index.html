<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | CWOWD</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        color: #f5f5f5;
        font-family: Arial, sans-serif;
        background: #111;
      }

      .game-shell {
        display: flex;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        flex-direction: column;
      }

      .game-toolbar {
        display: flex;
        min-height: 56px;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 8px 16px;
        background: #202124;
      }

      .game-title {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }

      .room-status {
        overflow: hidden;
        color: #c7ccd5;
        font-size: 13px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .game-controls {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .volume-control {
        display: flex;
        min-width: 190px;
        align-items: center;
        gap: 8px;
        font-size: 14px;
      }

      .volume-control input {
        width: 120px;
        accent-color: #8ab4f8;
      }

      #volume-value {
        min-width: 38px;
        text-align: right;
      }

      #fullscreen-button {
        min-height: 36px;
        padding: 0 12px;
        border: 0;
        border-radius: 4px;
        color: #111;
        background: #8ab4f8;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }

      #leave-room-button {
        min-height: 36px;
        padding: 0 12px;
        border: 1px solid #6f7785;
        border-radius: 4px;
        color: #f5f5f5;
        background: transparent;
        font-size: 14px;
        cursor: pointer;
      }

      #main-menu-button {
        min-height: 36px;
        padding: 0 12px;
        border: 1px solid #6f7785;
        border-radius: 4px;
        color: #f5f5f5;
        background: transparent;
        font-size: 14px;
        cursor: pointer;
      }

      #fullscreen-button:focus-visible,
      #leave-room-button:focus-visible,
      #main-menu-button:focus-visible,
      .volume-control input:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }

      .game-stage {
        display: grid;
        min-height: 0;
        flex: 1;
        place-items: center;
        overflow: hidden;
        padding: 12px;
        background: #050505;
      }

      .game-shell:fullscreen .game-toolbar {
        display: none;
      }

      .game-shell:fullscreen .game-stage {
        padding: 0;
      }

      #unity-canvas {
        display: block;
        width: min(100%, calc((100dvh - 80px) * 16 / 9));
        max-height: 100%;
        aspect-ratio: 16 / 9;
        background: #231f20;
      }

      .game-shell:fullscreen #unity-canvas {
        width: min(100%, calc(100dvh * 16 / 9));
      }

      @media (max-width: 520px) {
        .game-toolbar {
          gap: 8px;
          padding: 8px;
        }

        .game-title {
          font-size: 14px;
        }

        .game-controls {
          gap: 8px;
        }

        .room-status {
          max-width: 90px;
          font-size: 11px;
        }

        .volume-control {
          min-width: 0;
          gap: 4px;
        }

        .volume-control input {
          width: 72px;
        }

        #fullscreen-button {
          padding: 0 8px;
          font-size: 12px;
        }

        #leave-room-button {
          padding: 0 8px;
          font-size: 12px;
        }

        #main-menu-button {
          padding: 0 8px;
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main class="game-shell" id="game-shell">
      <header class="game-toolbar">
        <h1 class="game-title">CWOWD</h1>
        <span class="room-status" id="room-status" role="status">Connecting to room…</span>
        <div class="game-controls">
          <label class="volume-control" for="volume-slider">
            <span>Volume</span>
            <input id="volume-slider" type="range" min="0" max="100" value="100">
            <output id="volume-value" for="volume-slider">100%</output>
          </label>
          <button id="leave-room-button" type="button" disabled>Leave room</button>
          <button id="main-menu-button" type="button" hidden>Main menu</button>
          <button id="fullscreen-button" type="button">Fullscreen</button>
        </div>
      </header>
      <section class="game-stage" aria-label="Game">
        <canvas id="unity-canvas" width="1280" height="720" tabindex="-1"></canvas>
      </section>
    </main>

    <script>
      const volumeSlider = document.querySelector("#volume-slider");
      const volumeValue = document.querySelector("#volume-value");
      const masterGains = new Set();
      let masterVolume = Number(volumeSlider.value) / 100;

      function setMasterVolume(volume) {
        masterVolume = volume;
        masterGains.forEach((gain) => {
          gain.gain.value = masterVolume;
        });
        volumeValue.value = `${Math.round(masterVolume * 100)}%`;
      }

      volumeSlider.addEventListener("input", () => {
        setMasterVolume(Number(volumeSlider.value) / 100);
      });

      if (window.AudioNode) {
        const connect = AudioNode.prototype.connect;

        AudioNode.prototype.connect = function (destination, output, input) {
          if (destination === this.context.destination) {
            const masterGain = this.context.createGain();
            masterGain.gain.value = masterVolume;
            masterGains.add(masterGain);

            if (output === undefined) {
              connect.call(this, masterGain);
            } else {
              connect.call(this, masterGain, output);
            }

            if (input === undefined) {
              connect.call(masterGain, destination);
            } else {
              connect.call(masterGain, destination, 0, input);
            }

            return destination;
          }

          return connect.apply(this, arguments);
        };
      }

      const gameShell = document.querySelector("#game-shell");
      const fullscreenButton = document.querySelector("#fullscreen-button");

      function updateFullscreenButton() {
        fullscreenButton.textContent = document.fullscreenElement === gameShell
          ? "Exit fullscreen"
          : "Fullscreen";
      }

      fullscreenButton.addEventListener("click", () => {
        const fullscreenChange = document.fullscreenElement
          ? document.exitFullscreen()
          : gameShell.requestFullscreen();

        fullscreenChange.catch((error) => {
          console.error("Could not change fullscreen mode:", error);
        });
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && document.fullscreenElement === gameShell) {
          event.preventDefault();
          document.exitFullscreen().catch((error) => {
            console.error("Could not exit fullscreen mode:", error);
          });
        }
      });

      document.addEventListener("fullscreenchange", updateFullscreenButton);
    </script>
    <script>
      const roomStatus = document.querySelector("#room-status");
      const leaveRoomButton = document.querySelector("#leave-room-button");
      const mainMenuButton = document.querySelector("#main-menu-button");
      const roomParameters = new URLSearchParams(window.location.search);
      const seatToken = roomParameters.get("seat");
      const lobbyUrl = new URL(window.location.href);
      lobbyUrl.port = roomParameters.get("lobbyPort") || "8080";
      lobbyUrl.pathname = "/";
      lobbyUrl.search = "";
      lobbyUrl.hash = "";

      let assignedRoomCode = "";
      let assignedPlayerNumber = 0;
      let roomSocket;
      let leavingRoom = false;
      let gameStarted = false;
      const roomInputListeners = new Set();
      const localMode = roomParameters.get("local") === "1";

      function updateRoomStatus(message) {
        roomStatus.textContent = `Room ${assignedRoomCode} · Player ${assignedPlayerNumber} · ${message}`;
      }

      window.CWOWDRoom = {
        getPlayerNumber() {
          return assignedPlayerNumber;
        },
        sendInput(input) {
          if (
            !input ||
            typeof input !== "object" ||
            Array.isArray(input) ||
            !roomSocket ||
            roomSocket.readyState !== WebSocket.OPEN
          ) {
            return false;
          }

          roomSocket.send(JSON.stringify({ type: "input", input }));
          return true;
        },
        onInput(listener) {
          if (typeof listener !== "function") {
            throw new TypeError("Room input listener must be a function.");
          }
          roomInputListeners.add(listener);
          return () => roomInputListeners.delete(listener);
        }
      };

      function returnToLobby() {
        if (leavingRoom) {
          return;
        }
        leavingRoom = true;
        window.location.assign(lobbyUrl.toString());
      }

      function startGame() {
        if (gameStarted) {
          return;
        }

        gameStarted = true;
        const loader = document.createElement("script");
        loader.src = "Build/Builds.loader.js";
        loader.onload = () => {
          createUnityInstance(document.querySelector("#unity-canvas"), {
            dataUrl: "Build/Builds.data.gz",
            frameworkUrl: "Build/Builds.framework.js.gz",
            codeUrl: "Build/Builds.wasm.gz",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "MythosGames",
            productName: "CWOWD",
            productVersion: "0.1.0"
          }).catch((error) => {
            console.error("Could not start the Unity game:", error);
            roomStatus.textContent = "The game could not be loaded.";
          });
        };
        loader.onerror = () => {
          roomStatus.textContent = "Could not load the Unity game.";
        };
        document.body.append(loader);
      }

      leaveRoomButton.addEventListener("click", () => {
        leaveRoomButton.disabled = true;
        roomStatus.textContent = "Closing room and returning to lobby…";
        if (roomSocket && roomSocket.readyState === WebSocket.OPEN) {
          roomSocket.send(JSON.stringify({ type: "leave" }));
          window.setTimeout(returnToLobby, 1500);
        } else {
          returnToLobby();
        }
      });

      mainMenuButton.addEventListener("click", () => {
        window.location.assign("/");
      });

      if (localMode) {
        roomStatus.hidden = true;
        leaveRoomButton.hidden = true;
        mainMenuButton.hidden = false;
        startGame();
      } else if (!seatToken) {
        roomStatus.textContent = "This game must be opened from a lobby room.";
        window.setTimeout(returnToLobby, 2500);
      } else {
        const socketProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        roomSocket = new WebSocket(
          `${socketProtocol}//${window.location.host}/room?seat=${encodeURIComponent(seatToken)}`
        );

        roomSocket.addEventListener("open", () => {
          leaveRoomButton.disabled = false;
        });

        roomSocket.addEventListener("message", (event) => {
          const message = JSON.parse(event.data);
          if (message.type === "joined") {
            assignedRoomCode = message.roomCode;
            assignedPlayerNumber = message.playerNumber;
            updateRoomStatus("waiting for opponent");
            startGame();
          } else if (message.type === "playerJoined") {
            updateRoomStatus(message.playerCount === 2
              ? "both players connected · controls are not synced in this build"
              : "waiting for the other player");
          } else if (message.type === "remoteInput") {
            roomInputListeners.forEach((listener) => {
              listener(message.playerNumber, message.input);
            });
          } else if (message.type === "roomClosed") {
            roomStatus.textContent = "Room closed. Returning to lobby…";
            returnToLobby();
          }
        });

        roomSocket.addEventListener("error", () => {
          roomStatus.textContent = "Could not connect to the room. Returning to lobby…";
        });

        roomSocket.addEventListener("close", () => {
          if (!leavingRoom) {
            returnToLobby();
          }
        });
      }
    </script>
  </body>
</html>
